[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statkit"
version = "0.2.0"
description = "Reproducible statistics for research in pure NumPy: t-tests, ANOVA, rank tests, effect sizes with exact CIs, BCa bootstrap, permutation tests, multiple-comparison correction, power, meta-analysis, APA-style output."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Benjaminwz" }]
keywords = [
    "statistics", "reproducible research", "hypothesis testing", "effect size", "bootstrap",
    "permutation test", "multiple comparisons", "power analysis", "meta-analysis", "APA",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "scipy>=1.9", "statsmodels>=0.13"]

[project.urls]
Homepage = "https://github.com/Benjaminwz/statkit"
Issues = "https://github.com/Benjaminwz/statkit/issues"
Changelog = "https://github.com/Benjaminwz/statkit/blob/main/CHANGELOG.md"

[project.scripts]
statkit = "statkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["statkit"]
