[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statkit"
version = "0.1.0"
description = "Small, dependency-light statistics toolkit for reproducible research: effect sizes, bootstrap CIs, permutation tests, multiple-comparison correction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
statkit = "statkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
