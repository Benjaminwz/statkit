name: CI
on:
  push:
    paths: ["**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["**", ".github/workflows/ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
